name: 🎯 Lotto 5/35 (mỗi 5 phút)

# 5/35 quay 2 lần/ngày: 13:00 VN và 21:00 VN
# → Chạy mỗi 5 phút, tự pick up kết quả ngay khi có
# → concurrency đảm bảo không có 2 job chạy cùng lúc

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: lotto535-live
  cancel-in-progress: true

jobs:
  lotto535:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -q -r requirements.txt

      - name: 🎯 Fetch Lotto 5/35
        run: python scripts/fetch_ketqua.py power535

      - name: 📝 Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/power535.jsonl
          if git diff --staged --quiet; then
            echo "⏭ Không có dữ liệu mới"
            exit 0
          fi
          git commit -m "lotto535: $(date +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "⚠️ Push lần $i thất bại, thử lại..."
            sleep 5
          done
