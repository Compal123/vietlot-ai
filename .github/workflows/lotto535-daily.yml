name: 🎯 Lotto 5/35 (2 kỳ mỗi ngày)

# Lotto 5/35 quay 2 lần/ngày: 13:00 và 21:00 VN
# Chạy sau 21:15 VN (14:15 UTC) để lấy cả 2 kỳ trong ngày

on:
  schedule:
    - cron: '15 14 * * *'   # 21:15 VN
  workflow_dispatch:

jobs:
  lotto535:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -q -r requirements.txt

      - name: 🎯 Fetch Lotto 5/35
        run: |
          DELAY=$(( RANDOM % 30 + 5 ))
          echo "⏳ Random delay ${DELAY}s..."
          sleep $DELAY
          python scripts/fetch_ketqua.py power535

      - name: 📝 Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/power535.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "⏭ Không có dữ liệu mới"
          else
            git commit -m "lotto535: $(date +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
