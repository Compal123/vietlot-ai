name: 📄 Deploy GitHub Pages

# Deploy mỗi 5 phút trong giờ Keno (06:05–22:00 VN) + on push
# GitHub chỉ đảm bảo schedule >= 5 phút, dưới đó không tin được

on:
  push:
    branches: [main]
  schedule:
    - cron: '5-59/5 23 * * *'   # 06:05–06:59 VN
    - cron: '*/5 0-14 * * *'    # 07:00–21:55 VN
    - cron: '0 15 * * *'        # 22:00 VN
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            data

      - name: ⚙️ Configure Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
