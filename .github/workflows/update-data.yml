name: 🎰 Cập nhật dữ liệu hàng ngày

# Lịch quay (giờ VN):
#   Power 6/55  : Thứ 3, 5, 7 — 18:00
#   Mega 6/45   : Thứ 4, 6, CN — 18:00
#   Max3D       : Thứ 2, 4, 6  — 18:00
#   Max3D Pro   : Thứ 3, 5, 7  — 18:00
#
# → Chạy lúc 19:05 VN (12:05 UTC) — 65 phút sau giờ quay
# → Tự động thử lại ngay tối đa 3 lần nếu chưa có kết quả

on:
  schedule:
    - cron: '5 12 * * *'   # 19:05 VN hàng ngày
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -q -r requirements.txt

      - name: 🎰 Fetch kết quả (tự động thử lại tối đa 3 lần)
        run: |
          FOUND=0
          for attempt in 1 2 3; do
            echo "🔄 Lần thử $attempt/3..."
            python scripts/fetch_ketqua.py
            git add data/
            if ! git diff --staged --quiet; then
              echo "✅ Có dữ liệu mới ở lần thử $attempt"
              FOUND=1
              break
            fi
            # Unstage để lần sau stage lại sạch
            git restore --staged data/ 2>/dev/null || git reset HEAD data/ 2>/dev/null || true
            if [ $attempt -lt 3 ]; then
              echo "⏳ Chưa có kết quả, thử lại sau 30s..."
              sleep 30
            fi
          done
          echo "FOUND=$FOUND" >> $GITHUB_ENV

      - name: 🎰 Fetch Keno (backup hàng ngày — bắt các kỳ live workflow bỏ sót)
        run: python scripts/fetch_keno_live.py
        continue-on-error: true

      - name: 💰 Fetch Jackpot tích lũy (backup — chủ yếu do lotto535 workflow lo)
        run: python scripts/fetch_jackpots.py
        continue-on-error: true

      - name: 🔮 Cập nhật dự đoán công khai (điền kết quả kỳ trước + tạo dự đoán kỳ tới)
        run: python scripts/build_predictions.py
        continue-on-error: true

      - name: ✍️ Tạo bài viết phân tích bằng Gemini (chỉ khi có kỳ mới)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/build_articles.py
        continue-on-error: true

      - name: 📝 Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "⏭ Không có dữ liệu mới"
          else
            git commit -m "data: cập nhật $(date +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
