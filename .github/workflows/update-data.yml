name: 🎰 Xổ Số Buổi Tối (18:25 VN hàng ngày)

# Lịch quay tối (18:00-18:15 VN = 11:00-11:15 UTC):
#  Thứ 2 (Mon): Max3D
#  Thứ 3 (Tue): Power 6/55 + Max3D Pro
#  Thứ 4 (Wed): Mega 6/45 + Max3D
#  Thứ 5 (Thu): Power 6/55 + Max3D Pro
#  Thứ 6 (Fri): Mega 6/45 + Max3D
#  Thứ 7 (Sat): Power 6/55 + Max3D Pro
#  Chủ nhật:   Mega 6/45
# → Chạy 11:25 UTC mỗi ngày, tự detect ngày để scrape đúng game

on:
  schedule:
    - cron: '25 11 * * *'   # 18:25 VN hàng ngày
  workflow_dispatch:

jobs:
  evening-draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -q -r requirements.txt

      - name: 🎯 Xác định game theo ngày
        id: pick
        run: |
          # DOW: 0=Sun, 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat
          DOW=$(date -u +%w)
          echo "Hôm nay DOW=$DOW ($(date -u +'%A'))"
          case $DOW in
            0) GAMES="power645"                    ;; # Chủ nhật
            1) GAMES="max3d"                       ;; # Thứ 2
            2) GAMES="power655 max3dpro"            ;; # Thứ 3
            3) GAMES="power645 max3d"              ;; # Thứ 4
            4) GAMES="power655 max3dpro"            ;; # Thứ 5
            5) GAMES="power645 max3d"              ;; # Thứ 6
            6) GAMES="power655 max3dpro"            ;; # Thứ 7
          esac
          echo "GAMES=$GAMES" >> $GITHUB_OUTPUT
          echo "Games sẽ scrape: $GAMES"

      - name: 🎰 Scrape games buổi tối
        run: |
          DELAY=$(( RANDOM % 120 + 10 ))
          echo "⏳ Random delay ${DELAY}s..."
          sleep $DELAY
          python scripts/fetch_data.py ${{ steps.pick.outputs.GAMES }}

      - name: 📝 Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "⏭ Không có dữ liệu mới"
          else
            git commit -m "evening [${{ steps.pick.outputs.GAMES }}]: $(date +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
