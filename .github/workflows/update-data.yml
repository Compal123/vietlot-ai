name: 🎰 Cập nhật dữ liệu hàng ngày

# Chạy 18:30 VN (11:30 UTC) mỗi ngày
# Lấy kết quả Power655, Power645, Lotto535, Max3D, Max3D Pro
# từ ketquadientoan.com — không cần proxy, không bị block

on:
  schedule:
    - cron: '30 11 * * *'   # 18:30 VN hàng ngày
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -q -r requirements.txt

      - name: 🎰 Fetch kết quả mới
        run: |
          DELAY=$(( RANDOM % 60 + 5 ))
          echo "⏳ Random delay ${DELAY}s..."
          sleep $DELAY
          python scripts/fetch_ketqua.py

      - name: 📝 Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "⏭ Không có dữ liệu mới"
          else
            git commit -m "data: cập nhật $(date +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
