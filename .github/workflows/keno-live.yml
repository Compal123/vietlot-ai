name: 🎰 Keno Live (mỗi 1 phút)

# Keno quay mỗi ~8 phút từ 06:00–22:00 VN (ICT = UTC+7)
# → Chạy mỗi 1 phút, bắt đầu 06:10 VN đến 22:00 VN
# → 06:10–06:59 VN : cron '10-59 23 * * *'
# → 07:00–21:59 VN : cron '* 0-14 * * *'
# → 22:00 VN (chạy lần cuối) : cron '0 15 * * *'

on:
  schedule:
    - cron: '10-59 23 * * *'  # 06:10–06:59 VN
    - cron: '* 0-14 * * *'    # 07:00–21:59 VN
    - cron: '0 15 * * *'      # 22:00 VN (lần cuối)
  workflow_dispatch:

jobs:
  keno-live:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -q requests beautifulsoup4 lxml

      - name: 🎰 Fetch Keno Live
        run: python scripts/fetch_keno_live.py

      - name: 📝 Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/keno.jsonl
          if git diff --staged --quiet; then
            echo "⏭ Không có kỳ mới"
          else
            git commit -m "keno: $(date +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
