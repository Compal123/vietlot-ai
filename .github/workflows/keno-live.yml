name: 🎰 Keno Live (mỗi 10 phút)

# Keno quay mỗi ~8 phút từ 06:00–22:00 VN (ICT = UTC+7)
# → Chạy mỗi 10 phút — live endpoint trả ~5 kỳ (~40 phút) nên 10 phút đủ bắt hết
# → concurrency: cancel-in-progress — tránh race condition ghi đè keno.jsonl
# → Source: ketquadientoan.com (không bị block từ GitHub Actions)

on:
  schedule:
    - cron: '*/10 23 * * *'          # 06:xx VN (23 UTC hôm trước)
    - cron: '*/10 0-14 * * *'        # 07:xx–21:xx VN (00–14 UTC)
    - cron: '0 15 * * *'             # 22:00 VN — lần cuối
  workflow_dispatch:

concurrency:
  group: keno-live
  cancel-in-progress: true

jobs:
  keno-live:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -q requests beautifulsoup4 lxml

      - name: 🎰 Fetch Keno Live (ketquadientoan.com)
        run: python scripts/fetch_keno_live.py

      - name: 📝 Commit & Push (với retry)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/keno.jsonl
          if git diff --staged --quiet; then
            echo "⏭ Không có kỳ mới"
            exit 0
          fi
          LATEST=$(python3 -c "
import json
with open('data/keno.jsonl') as f:
    d = json.loads(f.readline())
print(f\"#{d.get('id','?')} {d.get('date','?')} {d.get('time','')}\")
" 2>/dev/null || echo "?")
          git commit -m "keno: ${LATEST} ($(date +'%H:%M UTC'))"

          # Retry push tối đa 3 lần để xử lý conflict từ run song song
          for attempt in 1 2 3; do
            git pull --rebase origin main -- data/keno.jsonl 2>/dev/null || git pull --rebase origin main || true
            if git push origin main; then
              echo "✅ Push thành công lần $attempt"
              break
            fi
            echo "⚠️ Push thất bại lần $attempt, thử lại..."
            sleep $((attempt * 5))
          done
