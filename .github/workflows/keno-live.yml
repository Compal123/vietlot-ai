name: 🎰 Keno Live (mỗi 5 phút)

# Keno quay mỗi ~8 phút từ 06:00–22:00 VN (ICT = UTC+7)
# GitHub đảm bảo schedule tối thiểu mỗi 5 phút (chạy 1 phút không tin được)
# → Chạy mỗi 5 phút, bắt đầu 06:05 VN đến 22:00 VN
# → Keno quay 8 phút, ta chạy 5 phút → không bao giờ bỏ sót kỳ nào

on:
  schedule:
    - cron: '5-59/5 23 * * *'   # 06:05–06:59 VN  (23:05–23:59 UTC)
    - cron: '*/5 0-14 * * *'    # 07:00–21:55 VN  (00:00–14:55 UTC)
    - cron: '0 15 * * *'        # 22:00 VN - lần cuối
  workflow_dispatch:

jobs:
  keno-live:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -q requests beautifulsoup4 lxml

      - name: 🎰 Fetch Keno Live
        run: python scripts/fetch_keno_live.py

      - name: 📝 Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/keno.jsonl
          if git diff --staged --quiet; then
            echo "⏭ Không có kỳ mới"
          else
            git commit -m "keno: $(date +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
