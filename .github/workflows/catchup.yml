name: 🔄 Catch-up dữ liệu còn thiếu (chạy thủ công)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Số ngày cần bù (mặc định 30)"
        required: false
        default: "30"
      games:
        description: "Games cần catch-up, cách nhau bằng space (trống = tất cả)"
        required: false
        default: ""
      from_date:
        description: "Hoặc nhập ngày bắt đầu cụ thể (YYYY-MM-DD)"
        required: false
        default: ""

jobs:
  catchup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -q -r requirements.txt

      - name: 🔄 Fetch dữ liệu còn thiếu
        run: |
          GAMES="${{ github.event.inputs.games }}"
          FROM="${{ github.event.inputs.from_date }}"
          DAYS="${{ github.event.inputs.days }}"

          DELAY=$(( RANDOM % 30 + 5 ))
          echo "⏳ Random delay ${DELAY}s..."
          sleep $DELAY

          if [ -n "$FROM" ]; then
            echo "📅 Từ ngày: $FROM"
            CMD="python scripts/fetch_ketqua.py --from $FROM"
          else
            echo "📅 ${DAYS} ngày gần nhất"
            CMD="python scripts/fetch_ketqua.py --days ${DAYS:-30}"
          fi

          if [ -n "$GAMES" ]; then
            $CMD $GAMES
          else
            $CMD
          fi

      - name: 📝 Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "⏭ Không có dữ liệu mới"
          else
            git commit -m "catchup: bổ sung dữ liệu còn thiếu $(date +'%Y-%m-%d')"
            git push
          fi

      - name: 📊 Thống kê
        run: |
          echo "=== Thống kê data/ ==="
          for f in data/*.jsonl; do
            COUNT=$(wc -l < "$f" 2>/dev/null || echo 0)
            LATEST=$(python3 -c "
          import json
          with open('$f') as fh:
              line = fh.readline().strip()
          print(json.loads(line).get('date','?') if line else 'trống')
          " 2>/dev/null || echo "?")
            echo "  $(basename $f): ${COUNT} bản ghi | mới nhất: ${LATEST}"
          done
