name: 🔄 Catch-up dữ liệu còn thiếu (chạy thủ công)

# Chạy thủ công khi cần lấy bù dữ liệu bị thiếu.
# Quét nhiều trang hơn bình thường để đảm bảo đủ dữ liệu.

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Số trang quét mỗi game (mặc định 15 ≈ 3 tháng data)"
        required: false
        default: "15"
      games:
        description: "Games cần catch-up, cách nhau bằng space (trống = tất cả)"
        required: false
        default: ""

jobs:
  catchup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Cài dependencies
        run: |
          pip install -q -r requirements.txt
          pip install -q playwright
          playwright install chromium --with-deps

      - name: 🔍 DEBUG — Cloudflare response + Playwright cookies
        run: |
          python3 - <<'PYEOF'
          import requests, re

          # ── Test 1: Raw response từ GitHub Actions IP ──────────────────────
          print("=== TEST 1: requests.get (python-requests UA) ===")
          try:
              r = requests.get("https://vietlott.vn/ajaxpro/", timeout=20)
              print(f"Status: {r.status_code}")
              print(f"Response (3000 chars):\n{r.text[:3000]}")
              m = re.search(r'document\.cookie="(.*?)"', r.text)
              print(f"\ndocument.cookie match: {'FOUND: '+m.group(1)[:50] if m else 'NOT FOUND'}")
          except Exception as e:
              print(f"Error: {e}")

          # ── Test 2: Playwright ─────────────────────────────────────────────
          print("\n=== TEST 2: Playwright ===")
          try:
              from playwright.sync_api import sync_playwright
              with sync_playwright() as pw:
                  browser = pw.chromium.launch(headless=True)
                  ctx = browser.new_context()
                  page = ctx.new_page()
                  page.goto("https://vietlott.vn/", wait_until="domcontentloaded", timeout=40000)
                  print(f"Page title after load: {page.title()}")
                  # Chờ cf_clearance xuất hiện (tối đa 30s)
                  try:
                      page.wait_for_function(
                          "() => document.cookie.includes('cf_clearance')",
                          timeout=30000
                      )
                      print("cf_clearance: FOUND!")
                  except Exception as e2:
                      print(f"cf_clearance: NOT FOUND after 30s ({e2})")
                  # In tất cả cookies
                  cookies = ctx.cookies("https://vietlott.vn")
                  print(f"All cookies ({len(cookies)}): {[(c['name'],c['value'][:10]) for c in cookies]}")
                  # In page source snippet
                  content = page.content()
                  print(f"Page content snippet: {content[:500].replace(chr(10),' ')}")
                  browser.close()
          except Exception as e:
              print(f"Playwright error: {e}")
          PYEOF

      - name: 🔄 Fetch dữ liệu (nhiều trang)
        run: |
          PAGES="${{ github.event.inputs.pages }}"
          GAMES="${{ github.event.inputs.games }}"
          PAGES=${PAGES:-15}

          echo "📄 Pages: $PAGES"

          DELAY=$(( RANDOM % 120 + 10 ))
          echo "⏳ Random delay ${DELAY}s..."
          sleep $DELAY

          if [ -z "$GAMES" ]; then
            echo "🎯 Games: tất cả"
            USE_PROXY=1 python scripts/fetch_data.py --pages $PAGES
          else
            echo "🎯 Games: $GAMES"
            USE_PROXY=1 python scripts/fetch_data.py $GAMES --pages $PAGES
          fi

      - name: 📝 Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "⏭ Không có dữ liệu mới"
          else
            SUMMARY=$(git diff --staged --stat | tail -1)
            git commit -m "catchup: bổ sung dữ liệu còn thiếu ($SUMMARY)"
            git push
          fi

      - name: 📊 Thống kê kết quả
        run: |
          echo "=== Thống kê data/ sau catch-up ==="
          for f in data/*.jsonl; do
            COUNT=$(wc -l < "$f" 2>/dev/null || echo 0)
            LATEST=$(python3 -c "
          import json
          with open('$f') as fh:
              line = fh.readline().strip()
          if line:
              d = json.loads(line)
              print(d.get('date', '?'))
          else:
              print('trống')
          " 2>/dev/null || echo "?")
            echo "  $(basename $f): ${COUNT} bản ghi | mới nhất: ${LATEST}"
          done
