name: 🔄 Catch-up dữ liệu còn thiếu (chạy thủ công)

# Chạy thủ công khi cần lấy bù dữ liệu bị thiếu.
# Quét nhiều trang hơn bình thường để đảm bảo đủ dữ liệu.

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Số trang quét mỗi game (mặc định 15 ≈ 3 tháng data)"
        required: false
        default: "15"
      games:
        description: "Games cần catch-up, cách nhau bằng space (trống = tất cả)"
        required: false
        default: ""

jobs:
  catchup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Cài dependencies
        run: pip install -q -r requirements.txt

      - name: 🔄 Fetch dữ liệu (nhiều trang)
        run: |
          PAGES="${{ github.event.inputs.pages }}"
          GAMES="${{ github.event.inputs.games }}"
          PAGES=${PAGES:-15}

          echo "📄 Pages: $PAGES"

          DELAY=$(( RANDOM % 60 + 5 ))
          echo "⏳ Random delay ${DELAY}s..."
          sleep $DELAY

          if [ -z "$GAMES" ]; then
            echo "🎯 Games: tất cả"
            python scripts/fetch_data.py --pages $PAGES
          else
            echo "🎯 Games: $GAMES"
            python scripts/fetch_data.py $GAMES --pages $PAGES
          fi

      - name: 📝 Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "⏭ Không có dữ liệu mới"
          else
            SUMMARY=$(git diff --staged --stat | tail -1)
            git commit -m "catchup: bổ sung dữ liệu còn thiếu ($SUMMARY)"
            git push
          fi

      - name: 📊 Thống kê kết quả
        run: |
          echo "=== Thống kê data/ sau catch-up ==="
          for f in data/*.jsonl; do
            COUNT=$(wc -l < "$f" 2>/dev/null || echo 0)
            LATEST=$(python3 -c "
          import json
          with open('$f') as fh:
              line = fh.readline().strip()
          if line:
              d = json.loads(line)
              print(d.get('date', '?'))
          else:
              print('trống')
          " 2>/dev/null || echo "?")
            echo "  $(basename $f): ${COUNT} bản ghi | mới nhất: ${LATEST}"
          done
