name: 🔄 Catch-up dữ liệu còn thiếu (chạy thủ công)

# Chạy thủ công khi cần lấy bù dữ liệu bị thiếu.
# Quét nhiều trang hơn bình thường để đảm bảo đủ dữ liệu.

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Số trang quét mỗi game (mặc định 15 ≈ 3 tháng data)"
        required: false
        default: "15"
      games:
        description: "Games cần catch-up, cách nhau bằng space (trống = tất cả)"
        required: false
        default: ""

jobs:
  catchup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Cài dependencies
        run: pip install -q -r requirements.txt

      - name: 🔍 Kiểm tra VN proxy + Cloudflare cookie
        run: |
          python3 - <<'PYEOF'
          import requests, re, pandas as pd
          from io import StringIO
          print("=== Test VN proxy + Cloudflare cookie ===")
          HEADERS_GET = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"}
          # Lấy VN proxies
          try:
              resp = requests.get("https://free-proxy-list.net/", timeout=20, headers=HEADERS_GET)
              df = pd.read_html(StringIO(resp.text))[0]
              vn = df[df["Code"] == "VN"][["IP Address", "Port"]].head(5)
              proxies = [f"{row['IP Address']}:{int(row['Port'])}" for _, row in vn.iterrows()]
              print(f"VN proxies found: {proxies}")
          except Exception as e:
              print(f"Proxy list error: {e}")
              proxies = []
          # Test từng proxy
          for p in proxies:
              proxy = {"http": p, "https": p}
              try:
                  r = requests.get("https://vietlott.vn/ajaxpro/", headers=HEADERS_GET, proxies=proxy, timeout=12)
                  m = re.search(r'document\.cookie\s*=\s*["\']([^"\']+)["\']', r.text)
                  print(f"Proxy {p}: status={r.status_code}, cookie={'FOUND: '+m.group(1)[:30] if m else 'NOT FOUND'}")
                  if m:
                      print("✅ Proxy hoạt động!")
                      break
              except Exception as e:
                  print(f"Proxy {p}: ERROR {e}")
          PYEOF

      - name: 🔄 Fetch dữ liệu (nhiều trang)
        run: |
          PAGES="${{ github.event.inputs.pages }}"
          GAMES="${{ github.event.inputs.games }}"
          PAGES=${PAGES:-15}

          echo "📄 Pages: $PAGES"

          DELAY=$(( RANDOM % 120 + 10 ))
          echo "⏳ Random delay ${DELAY}s..."
          sleep $DELAY

          if [ -z "$GAMES" ]; then
            echo "🎯 Games: tất cả"
            USE_PROXY=1 python scripts/fetch_data.py --pages $PAGES
          else
            echo "🎯 Games: $GAMES"
            USE_PROXY=1 python scripts/fetch_data.py $GAMES --pages $PAGES
          fi

      - name: 📝 Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "⏭ Không có dữ liệu mới"
          else
            SUMMARY=$(git diff --staged --stat | tail -1)
            git commit -m "catchup: bổ sung dữ liệu còn thiếu ($SUMMARY)"
            git push
          fi

      - name: 📊 Thống kê kết quả
        run: |
          echo "=== Thống kê data/ sau catch-up ==="
          for f in data/*.jsonl; do
            COUNT=$(wc -l < "$f" 2>/dev/null || echo 0)
            LATEST=$(python3 -c "
          import json
          with open('$f') as fh:
              line = fh.readline().strip()
          if line:
              d = json.loads(line)
              print(d.get('date', '?'))
          else:
              print('trống')
          " 2>/dev/null || echo "?")
            echo "  $(basename $f): ${COUNT} bản ghi | mới nhất: ${LATEST}"
          done
