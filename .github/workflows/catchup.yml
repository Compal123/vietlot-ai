name: 🔄 Catch-up dữ liệu còn thiếu (chạy thủ công)

# Workflow chạy thủ công khi cần lấy bù dữ liệu bị thiếu.
# Quét nhiều trang hơn bình thường để đảm bảo không bỏ sót kỳ nào.

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Số trang quét mỗi game (mặc định 15 ≈ 3 tháng)"
        required: false
        default: "15"
      games:
        description: "Games cần catch-up (trống = tất cả)"
        required: false
        default: ""

jobs:
  catchup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Cài dependencies
        run: pip install -q -r requirements.txt

      - name: 🔄 Chạy fetch với nhiều trang hơn
        env:
          PAGES: ${{ github.event.inputs.pages }}
          GAMES: ${{ github.event.inputs.games }}
        run: |
          PAGES=${PAGES:-15}
          echo "📄 Số trang: $PAGES"

          # Patch fetch_data.py để dùng nhiều pages hơn
          python - <<EOF
          import subprocess, sys, os

          pages = int(os.environ.get("PAGES", 15))
          games_input = os.environ.get("GAMES", "").strip()

          # Import module và override số trang
          import importlib.util, pathlib, json, time

          spec = importlib.util.spec_from_file_location("fetch_data", "scripts/fetch_data.py")
          fd   = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fd)

          all_games = list(fd.GAMES.keys())
          if games_input:
              targets = [g.strip() for g in games_input.split() if g.strip() in fd.GAMES]
              if not targets:
                  print(f"❌ Không có game hợp lệ trong: {games_input}")
                  sys.exit(1)
          else:
              targets = all_games

          print(f"🎯 Games: {targets}")
          print(f"📄 Pages: {pages}")

          for g in targets:
              fn = fd.GAMES[g]
              import inspect
              sig = inspect.signature(fn)
              if "pages" in sig.parameters:
                  fn(pages=pages)
              else:
                  fn()
          EOF

      - name: 📝 Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "⏭ Không có dữ liệu mới"
          else
            SUMMARY=$(git diff --staged --stat | tail -1)
            git commit -m "catchup: bổ sung dữ liệu còn thiếu ($SUMMARY)"
            git push
          fi

      - name: 📊 Thống kê
        run: |
          echo "=== Thống kê data/ sau catch-up ==="
          for f in data/*.jsonl; do
            count=$(wc -l < "$f" 2>/dev/null || echo 0)
            latest=$(head -1 "$f" 2>/dev/null | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print(d.get('date','?'))" 2>/dev/null || echo "?")
            echo "  $(basename $f): $count bản ghi, mới nhất: $latest"
          done
